# Amplify Hosting custom response headers (applied to the static SPA).
# Mirrors backend/app/security_headers.py so the app is hardened whether the
# HTML is served by Amplify or by the FastAPI static fallback.
customHeaders:
  - pattern: '**'
    headers:
      # Report-Only first so a mistuned policy can never break the live SPA.
      # After confirming DevTools shows no violations, rename this key to
      # 'Content-Security-Policy' to enforce.
      - key: 'Content-Security-Policy-Report-Only'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; media-src 'self' data: blob:"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), geolocation=(), microphone=(self)'
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains'
